# Blueprint de Render para levantar el proyecto completo en un ambiente de
# pruebas (no es el setup de produccion real -- para eso falta, como minimo,
# dominio propio con subdominios wildcard para la multi-tenencia real).
#
# Como usarlo: en el dashboard de Render, "New" -> "Blueprint", apuntar al
# repo. Render detecta este archivo y crea los 3 recursos de abajo.
#
# Nota sobre multi-tenencia: el login resuelve la empresa por el subdominio
# (<identificador>.dominio) y, si no hay subdominio, por el correo. Como
# *.onrender.com no da subdominios propios, el nombre del servicio frontend
# ("marca-blanca-frontend" de abajo) queda pegado a la URL final
# (marca-blanca-frontend.onrender.com) y su "primer segmento" no va a matchear
# ninguna empresa real -- el login va a caer al flujo por correo, que si
# funciona. Para probar el flujo de subdominio hace falta un dominio propio
# con wildcard apuntando a este servicio.
databases:
  - name: marca-blanca-postgres
    databaseName: db_portal_guajiranet_control
    user: guajiranet_owner
    plan: free

services:
  - type: web
    name: marca-blanca-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DB_HOST
        fromDatabase: { name: marca-blanca-postgres, property: host }
      - key: DB_PORT
        fromDatabase: { name: marca-blanca-postgres, property: port }
      - key: DB_NAME
        fromDatabase: { name: marca-blanca-postgres, property: database }
      - key: DB_USER
        fromDatabase: { name: marca-blanca-postgres, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: marca-blanca-postgres, property: password }
      # Generado por Render (no lo pisa el default de application.yml) --
      # cambiar por un secreto real antes de usar esto para algo serio.
      - key: JWT_SECRET
        generateValue: true
      - key: CORREO_CLAVE_MAESTRA
        generateValue: true
      - key: OMNICANAL_CLAVE_MAESTRA
        generateValue: true
      # El envio de correo se configura aparte, desde /consola/correo (queda
      # guardado cifrado en BD con OMNICANAL_CLAVE_MAESTRA/CORREO_CLAVE_MAESTRA
      # de arriba) -- no depende de ninguna variable de entorno de Render.
      #
      # La API key de OpenAI si es un secreto real: se deja "sync: false"
      # para que Render la pida por el dashboard en vez de que quede escrita
      # aca (nunca pegar la clave en este archivo ni en el chat).
      - key: OMNICANAL_OPENAI_API_KEY
        sync: false
      - key: OMNICANAL_OPENAI_MODELO
        value: gpt-4.1-mini
      # *.onrender.com no da subdominios propios por empresa (ver nota de
      # arriba) -- se deja abierto a cualquier subdominio de onrender.com
      # ademas de localhost, para que el CORS no bloquee las pruebas.
      - key: APP_CORS_ORIGENES_PERMITIDOS
        value: https://*.onrender.com,http://localhost:4200,http://*.localhost:4200

  - type: web
    name: marca-blanca-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      # El hostname interno de red privada ("marca-blanca-backend:puerto")
      # no resolvia de forma confiable en el deploy inicial (nginx moria al
      # arrancar con "host not found in upstream") -- se usa la URL PUBLICA
      # del backend en su lugar, que siempre resuelve por DNS normal.
      - key: BACKEND_SCHEME
        value: https
      - key: BACKEND_HOST
        fromService:
          type: web
          name: marca-blanca-backend
          property: host
      - key: DNS_RESOLVER
        value: 1.1.1.1
