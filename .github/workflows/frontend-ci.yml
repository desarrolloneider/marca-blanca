name: Frontend CI

# Solo corre en el PR, no otra vez al mergear a main/develop -- si el PR
# ya paso build+test+Sonar con ese codigo exacto, repetirlo en el merge es
# trabajo duplicado, no una verificacion adicional real. Un push directo a
# develop/main (sin pasar por PR) no dispara este workflow; branch-policy.yml
# no lo bloquea tecnicamente, es una decision de confiar en que casi todo
# el equipo pasa por PR.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, develop]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    name: Install & build
    # dev-vm en vez de ubuntu-latest: este job corria en cada push/PR y
    # consumia los minutos facturables del plan. En dev-vm es gratis (es
    # infraestructura propia). Mismo patron que el job de Sonar: el runner
    # no tiene Node/pnpm ni acceso directo al socket de Docker, asi que se
    # orquesta el contenedor a mano via el wrapper con sudo.
    runs-on: [self-hosted, dev-vm]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install & build (en contenedor)
        run: |
          sudo /usr/local/bin/docker-rbac/devops-wrapper run --rm -i \
            -v "${{ github.workspace }}:/workspace" -w /workspace/frontend \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            node:24-bookworm bash -s <<'SCRIPT'
          set -e
          trap 'chown -R "$HOST_UID:$HOST_GID" /workspace' EXIT
          corepack enable
          corepack prepare pnpm@10 --activate
          pnpm install --frozen-lockfile
          pnpm exec ng build --configuration production
          SCRIPT

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/mi-proyecto-frontend
          retention-days: 7

  sonar:
    name: SonarQube analysis
    needs: build
    # Corre en el runner self-hosted porque SonarQube vive en la red interna
    # de la VM de dev (10.104.0.11), solo alcanzable desde ahí.
    # Nunca corre para PRs de forks externos: evita ejecutar código
    # no confiable en el runner self-hosted.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, dev-vm]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Sonar necesita historia completa para blame/nuevo código
          fetch-depth: 0

      # El runner (dev-vm) no tiene Node, pnpm ni Chrome, y el usuario del
      # sistema no tiene permisos para instalarlos ni para usar el socket de
      # Docker directamente (por eso la función nativa "container:" de
      # Actions no sirve: el propio runner no puede hablarle al daemon). Sí
      # existe un wrapper con sudo NOPASSWD que permite "docker run" con
      # volúmenes, así que el contenedor se orquesta a mano a través de él.
      # Chrome no arranca como root sin --no-sandbox (karma.conf.js define
      # el launcher ChromeHeadlessNoSandbox para este caso).
      - name: Install, test & analyze (en contenedor)
        if: ${{ vars.SONAR_HOST_URL != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          sudo /usr/local/bin/docker-rbac/devops-wrapper run --rm -i \
            -v "${{ github.workspace }}:/workspace" -w /workspace/frontend \
            -e SONAR_HOST_URL="$SONAR_HOST_URL" -e SONAR_TOKEN="$SONAR_TOKEN" \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            node:24-bookworm bash -s <<'SCRIPT'
          set -e
          # Todo dentro del contenedor corre como root (hace falta para el
          # apt-get del Chromium). Sin esto, node_modules/dist/etc. quedan
          # con dueño root en el workspace compartido del runner, y el
          # siguiente checkout -- que corre como el usuario real de la VM,
          # no root -- no los puede borrar ni sobreescribir (EACCES:
          # permission denied). trap asegura que se ejecute incluso si el
          # build falla.
          trap 'chown -R "$HOST_UID:$HOST_GID" /workspace' EXIT
          corepack enable
          corepack prepare pnpm@10 --activate
          apt-get update -qq
          apt-get install -y -qq chromium
          export CHROME_BIN="$(which chromium)"
          # Sin esto, Sonar nunca tiene un lcov.info que leer -- el
          # dashboard mostraba 0.0% de coverage aunque los specs existieran,
          # porque nunca se ejecutaban en CI.
          pnpm install --frozen-lockfile
          pnpm exec ng test --watch=false --browsers=ChromeHeadlessNoSandbox --code-coverage
          # El action oficial sonarsource/sonarqube-scan-action requiere un
          # runner con bash nativo tal como este, @sonar/scan es el wrapper
          # npm oficial de SonarSource, corre sobre Node.
          # -D sonar.qualitygate.wait=true: sin esto, el scanner manda el
          # analisis y sigue sin importar el resultado -- el Quality Gate no
          # bloqueaba nada, solo quedaba como dato en el dashboard. Con esto
          # el paso espera la respuesta de SonarQube y falla si el gate
          # queda en rojo (una de las 5 puertas del CLAUDE.md antes de
          # fusionar).
          pnpm dlx @sonar/scan -Dsonar.qualitygate.wait=true
          SCRIPT
