name: Database CI (Liquibase)

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/bootstrap/src/main/resources/db/changelog/**"
      - "backend/bootstrap/pom.xml"
      - ".github/workflows/db-ci.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, develop]
    paths:
      - "backend/bootstrap/src/main/resources/db/changelog/**"
      - "backend/bootstrap/pom.xml"
      - ".github/workflows/db-ci.yml"

permissions:
  contents: read

concurrency:
  group: db-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar-changelogs:
    name: Validar changelogs de Liquibase (control + cliente)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: guajiranet_owner
          POSTGRES_PASSWORD: guajiranet_owner
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guajiranet_owner"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Liquibase necesita resolver los jars de los modulos hermanos
      # (shared-kernel, usuarios-*, omnicanal-*) aunque no compile nada,
      # asi que instalamos el reactor completo una vez en el repo local.
      - name: Instalar modulos del backend
        working-directory: backend
        run: mvn -B -ntp -pl bootstrap -am install -DskipTests

      # El postgres del servicio arranca con una sola base ("postgres");
      # el changelog de "control" y el de "cliente" apuntan cada uno a su
      # propia base, así que las creamos antes de aplicar los changelogs.
      - name: Crear bases de datos temporales
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq postgresql-client
          PGPASSWORD=guajiranet_owner psql -h localhost -U guajiranet_owner -d postgres -c "CREATE DATABASE db_portal_guajiranet_control;"
          PGPASSWORD=guajiranet_owner psql -h localhost -U guajiranet_owner -d postgres -c "CREATE DATABASE db_plantilla_maestra;"

      # "control" va primero: su changeset 0000 crea los roles guajiranet_app
      # y guajiranet_lectura si no existen. Los roles de Postgres son a nivel
      # de cluster (no de base de datos), asi que "cliente" -que otorga
      # privilegios a esos mismos roles- los encuentra ya creados.
      - name: Validar changelog "control"
        working-directory: backend/bootstrap
        run: >
          mvn -B -ntp liquibase:update@aplicar-control
          -Dliquibase.control.url=jdbc:postgresql://localhost:5432/db_portal_guajiranet_control
          -Dliquibase.control.username=guajiranet_owner
          -Dliquibase.control.password=guajiranet_owner

      - name: Validar changelog "cliente"
        working-directory: backend/bootstrap
        run: >
          mvn -B -ntp liquibase:update@aplicar-cliente
          -Dliquibase.cliente.url=jdbc:postgresql://localhost:5432/db_plantilla_maestra
          -Dliquibase.cliente.username=guajiranet_owner
          -Dliquibase.cliente.password=guajiranet_owner

      - name: Resumen
        run: echo "Los changelogs de control y cliente aplicaron limpio contra Postgres 17."
