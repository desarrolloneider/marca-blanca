name: Backend CI

# Solo corre en el PR, no otra vez al mergear a main/develop -- si el PR
# ya paso build+test+Sonar con ese codigo exacto, repetirlo en el merge es
# trabajo duplicado, no una verificacion adicional real. Un push directo a
# develop/main (sin pasar por PR) no dispara este workflow; branch-policy.yml
# no lo bloquea tecnicamente, es una decision de confiar en que casi todo
# el equipo pasa por PR.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  build-test:
    name: Build & test (Java 25)
    # dev-vm en vez de ubuntu-latest: este job corria en cada push/PR y
    # consumia los minutos facturables del plan. En dev-vm es gratis (es
    # infraestructura propia). Mismo patron que el job de Sonar: el runner
    # no tiene Maven ni acceso directo al socket de Docker, asi que se
    # orquesta el contenedor a mano via el wrapper con sudo.
    runs-on: [self-hosted, dev-vm]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build & test (en contenedor)
        run: |
          sudo /usr/local/bin/docker-rbac/devops-wrapper run --rm -i \
            -v "${{ github.workspace }}:/workspace" -w /workspace/backend \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            eclipse-temurin:25 bash -s <<'SCRIPT'
          set -e
          trap 'chown -R "$HOST_UID:$HOST_GID" /workspace' EXIT
          apt-get update -qq
          apt-get install -y -qq maven
          mvn -B -ntp clean verify
          SCRIPT

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/**/target/surefire-reports/**
          if-no-files-found: ignore
          retention-days: 7

  sonar:
    name: SonarQube analysis
    needs: build-test
    # Corre en el runner self-hosted porque SonarQube vive en la red interna
    # de la VM de dev (10.104.0.11), solo alcanzable desde ahí.
    # Nunca corre para PRs de forks externos: evita ejecutar código
    # no confiable en el runner self-hosted.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, dev-vm]
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Sonar necesita historia completa para blame/nuevo código
          fetch-depth: 0

      # El runner (dev-vm) no tiene Maven y el usuario del sistema no tiene
      # permisos para instalarlo ni para usar el socket de Docker
      # directamente (por eso la función nativa "container:" de Actions no
      # sirve aquí: el propio runner no puede hablarle al daemon). Sí existe
      # un wrapper con sudo NOPASSWD que permite "docker run" con volúmenes,
      # así que el contenedor se orquesta a mano a través de él.
      # -Dsonar.qualitygate.wait=true: sin esto, mvn sonar:sonar manda el
      # analisis y sigue sin importar el resultado -- el Quality Gate no
      # bloqueaba nada, solo quedaba como dato en el dashboard. Con esto el
      # paso espera la respuesta de SonarQube y falla si el gate queda en
      # rojo (una de las 5 puertas del CLAUDE.md antes de fusionar).
      - name: Build, test & analyze (en contenedor)
        if: ${{ vars.SONAR_HOST_URL != '' }}
        run: |
          sudo /usr/local/bin/docker-rbac/devops-wrapper run --rm -i \
            -v "${{ github.workspace }}:/workspace" -w /workspace/backend \
            -e SONAR_HOST_URL="$SONAR_HOST_URL" -e SONAR_TOKEN="$SONAR_TOKEN" \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            eclipse-temurin:25 bash -s <<'SCRIPT'
          set -e
          # Todo dentro del contenedor corre como root (hace falta para el
          # apt-get). Sin esto, los archivos que Maven genera (target/,
          # .m2/) quedan con dueño root en el workspace compartido del
          # runner, y el siguiente checkout -- que corre como el usuario
          # real de la VM, no root -- no los puede borrar ni sobreescribir
          # (EACCES: permission denied). trap asegura que se ejecute incluso
          # si el build falla.
          trap 'chown -R "$HOST_UID:$HOST_GID" /workspace' EXIT
          apt-get update -qq
          apt-get install -y -qq maven
          mvn -B -ntp clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url="$SONAR_HOST_URL" -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.qualitygate.wait=true
          SCRIPT
