name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  build-test:
    name: Build & test (Java 25)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build & test
        run: mvn -B -ntp clean verify

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/**/target/surefire-reports/**
          if-no-files-found: ignore
          retention-days: 7

  sonar:
    name: SonarQube analysis
    needs: build-test
    # Corre en el runner self-hosted porque SonarQube vive en localhost,
    # solo alcanzable desde tu propia red/máquina.
    # Nunca corre para PRs de forks externos: evita ejecutar código
    # no confiable en el runner self-hosted (tu propia máquina).
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, Windows, X64]
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Sonar necesita historia completa para blame/nuevo código
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Add Maven to PATH
        shell: powershell
        run: |
          echo "C:\Users\HP VICTUS\Pictures\apache-maven-3.9.16-bin\apache-maven-3.9.16\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build, test & analyze
        if: ${{ vars.SONAR_HOST_URL != '' }}
        run: >
          mvn -B -ntp clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          "-Dsonar.host.url=${{ vars.SONAR_HOST_URL }}"
          "-Dsonar.token=${{ secrets.SONAR_TOKEN }}"
