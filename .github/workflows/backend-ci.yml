name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  build-test:
    name: Build & test (Java 25)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build & test
        run: mvn -B -ntp clean verify

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/**/target/surefire-reports/**
          if-no-files-found: ignore
          retention-days: 7

  sonar:
    name: SonarQube analysis
    needs: build-test
    # Corre en el runner self-hosted porque SonarQube vive en la red interna
    # de la VM de dev (10.104.0.11), solo alcanzable desde ahí.
    # Nunca corre para PRs de forks externos: evita ejecutar código
    # no confiable en el runner self-hosted.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, dev-vm]
    # Corre dentro de un contenedor Maven+JDK 25: el runner (dev-vm) no tiene
    # Maven instalado y el usuario del sistema no tiene permisos para
    # instalarlo. Dentro del contenedor no hace falta ese permiso.
    container:
      image: maven:3.9.9-eclipse-temurin-25
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Sonar necesita historia completa para blame/nuevo código
          fetch-depth: 0

      - name: Build, test & analyze
        if: ${{ vars.SONAR_HOST_URL != '' }}
        run: >
          mvn -B -ntp clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          "-Dsonar.host.url=${{ vars.SONAR_HOST_URL }}"
          "-Dsonar.token=${{ secrets.SONAR_TOKEN }}"
