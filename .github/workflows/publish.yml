name: Build & Publish

# Publica las imagenes Docker de backend y frontend a GitHub Container
# Registry (GHCR):
#   - main    -> tag "latest" + sha corto. Eso es lo que consideramos un
#                release.
#   - develop -> tag "dev" + sha corto, y ademas se despliega solo (sin
#                aprobacion, DEV esta autoaprobado) en la VM compartida
#                de desarrollo via el job "deploy-dev".
# No corre en PRs: ahi ya corren los CI de build+test+sonar, no hace falta
# publicar una imagen por cada commit de un PR todavia sin mergear.
on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/publish.yml"
      - "infra/scripts/deploy-container.sh"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publish-backend:
    name: Publicar imagen del backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # El driver "docker" por defecto no soporta exportar cache hacia GitHub
      # Actions (cache-to: type=gha) -- falla con "Cache export is not
      # supported for the docker driver". El driver "docker-container" si.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata de la imagen (tags)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/marca-blanca-backend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/develop' }}
            type=sha,format=short

      - name: Build & push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy: vulnerabilidades conocidas en el sistema operativo base y en
      # las librerias de la imagen (una de las 4 capas de analisis de
      # seguridad -- C-41). Escanea por digest, no por tag, asi no importa
      # cual tag se le puso. Dos pasadas a proposito: CRITICAL bloquea el
      # pipeline; HIGH solo queda reportado en el log, sin bloquear -- asi
      # no se frena la primera corrida por el volumen de hallazgos HIGH que
      # suele traer una imagen que nunca se habia escaneado.
      - name: Trivy -- bloquear por CRITICAL
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/marca-blanca-backend@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library

      - name: Trivy -- reportar HIGH (no bloquea)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/marca-blanca-backend@${{ steps.build.outputs.digest }}
          format: table
          severity: HIGH
          exit-code: 0
          ignore-unfixed: true
          vuln-type: os,library

  publish-frontend:
    name: Publicar imagen del frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # El driver "docker" por defecto no soporta exportar cache hacia GitHub
      # Actions (cache-to: type=gha) -- falla con "Cache export is not
      # supported for the docker driver". El driver "docker-container" si.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata de la imagen (tags)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/marca-blanca-frontend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/develop' }}
            type=sha,format=short

      - name: Build & push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy -- bloquear por CRITICAL
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/marca-blanca-frontend@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library

      - name: Trivy -- reportar HIGH (no bloquea)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/marca-blanca-frontend@${{ steps.build.outputs.digest }}
          format: table
          severity: HIGH
          exit-code: 0
          ignore-unfixed: true
          vuln-type: os,library

  deploy-dev:
    name: Desplegar en la VM de dev
    needs: [publish-backend, publish-frontend]
    # DEV esta autoaprobado (no necesita revision de arquitecto/Product
    # Owner como QA o PROD) -- se despliega solo en cada push a develop.
    if: github.ref == 'refs/heads/develop'
    runs-on: [self-hosted, dev-vm]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login en GHCR (en la VM)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo /usr/local/bin/docker-rbac/devops-wrapper login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Desplegar backend
        run: |
          chmod +x infra/scripts/deploy-container.sh
          infra/scripts/deploy-container.sh backend ${{ env.REGISTRY }}/${{ github.repository_owner }}/marca-blanca-backend:dev

      - name: Desplegar frontend
        run: |
          infra/scripts/deploy-container.sh frontend ${{ env.REGISTRY }}/${{ github.repository_owner }}/marca-blanca-frontend:dev
